<style>
    /* 横幅容器 - 纯净深色基底 */
    .apix-banner {
        width: 100%;
        max-width: 900px;
        background: linear-gradient(145deg, #0b1220 0%, #151d2e 100%);
        border-radius: 20px;
        padding: 48px;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(136, 202, 197, 0.2);
        box-shadow: 
            0 20px 60px -15px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* 简化光效 - 更纯净 */
    .apix-banner::before {
        content: '';
        position: absolute;
        top: -40%;
        right: -20%;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(136, 202, 197, 0.12) 0%, transparent 70%);
        pointer-events: none;
    }

    /* 内容布局 - 关键修复：垂直居中对齐 */
    .banner-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center; /* 改为center，解决对齐问题 */
        gap: 32px;
        flex-wrap: wrap;
    }

    /* Logo区域 - 扁平化设计，去除浑浊渐变 */
    .banner-logo {
        flex-shrink: 0;
        width: 80px;
        height: 80px;
        background: rgb(136, 202, 197);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 
            0 12px 40px -8px rgba(136, 202, 197, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
        position: relative;
        border: none;
    }

    /* 图标样式 - 关键修复：完美居中 */
    .banner-logo .icon {
        width: 48px;
        height: 48px;
        fill: #0b1220; /* 深色填充，提高对比度 */
        display: block;
    }

    /* 文字区域 - 移除顶部padding，与图标对齐 */
    .banner-text {
        flex: 1;
        min-width: 300px;
        padding-top: 0; /* 移除8px padding */
        display: flex;
        flex-direction: column;
        justify-content: center; /* 垂直居中内容 */
    }

    .banner-title-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 12px;
        width: 150px;
    }

    .banner-title {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 2px;
        margin: 0;
        font-family: 'You Yuan', monospace;
        color: transparent;
        -webkit-text-stroke: 2px rgb(136, 202, 197);
        text-stroke: 2px rgb(136, 202, 197);
        line-height: 1;
        display: flex;
        align-items: center;
    }

    /* beta标签 - 绝对定位右上角 */
    .version-tag {
        position: absolute;
        top: -8px;
        right: -50px;
        padding: 3px 8px;
        background: rgba(136, 202, 197, 0.05);
        border: 1px solid rgba(136, 202, 197, 0.2);
        border-radius: 18px;
        font-size: 10px;
        color: rgb(136, 202, 197);
        font-weight: 600;
        letter-spacing: 0.5px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 简化分隔线 */
    .divider {
        width: 40px;
        height: 2px;
        background: rgb(136, 202, 197);
        margin: 16px 0;
        border-radius: 1px;
        opacity: 0.6;
    }

    .banner-subtitle {
        font-size: 15px;
        color: #8b9aae; /* 更纯净的灰色 */
        line-height: 1.6;
        max-width: 550px;
        margin: 0;
    }

    .banner-subtitle strong {
        color: rgb(136, 202, 197);
        font-weight: 500;
    }

    /* 开发者标签 - 扁平化 */
    .banner-meta {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    .dev-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px 6px 11px;
        background: rgba(136, 202, 197, 0.08);
        border: 1px solid rgba(136, 202, 197, 0.2);
        border-radius: 20px;
        font-size: 12px;
        color: #c4d0dc;
        transition: all 0.2s ease;
    }

    .dev-badge:hover {
        background: rgba(136, 202, 197, 0.15);
        border-color: rgba(136, 202, 197, 0.35);
    }

    .dev-badge::before {
        content: '◆';
        font-size: 10px;
        color: rgb(136, 202, 197);
    }

    /* 引擎标签 - 简化 */
    .engine-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .engine-tag {
        padding: 5px 12px;
        background: rgba(136, 202, 197, 0.06);
        border: 1px solid rgba(136, 202, 197, 0.15);
        border-radius: 8px;
        font-size: 11px;
        color: #9ab;
        font-family: 'Courier New', monospace;
        font-weight: 500;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
    }

    .engine-tag:hover {
        background: rgba(136, 202, 197, 0.12);
        border-color: rgba(136, 202, 197, 0.3);
        color: rgb(200, 235, 230);
    }

    /* 装饰元素 - 极简 */
    .corner-accent {
        position: absolute;
        top: 0;
        right: 0;
        width: 120px;
        height: 120px;
        background: linear-gradient(225deg, rgba(136, 202, 197, 0.08) 0%, transparent 60%);
        pointer-events: none;
    }
</style>

        </div>
    </div>
