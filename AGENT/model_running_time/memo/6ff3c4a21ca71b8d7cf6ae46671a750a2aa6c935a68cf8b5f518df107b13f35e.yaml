工具功能分组决策: "已将18个可用工具按功能类别分为7个组：\n\n1. 工作区文件操作组：\n   - download_file_by_id\n   - read_workspace_file\n\
  \   - list_workspace_files\n   - modify_workspace_file\n   - create_workspace_file\n\
  \n2. 网络/搜索工具组：\n   - search_links_by_keywords\n   - fetch_content_by_urls\n\n3.\
  \ 任务委托工具组：\n   - assign_task\n   - query_task_by_id\n   - stop_task_by_id\n\n4.\
  \ 图像处理工具组：\n   - agent_ocr_analysis\n   - send_images_to_user\n\n5. 代码执行工具组：\n \
  \  - run_workspace_command\n   - execute_python_code\n\n6. 技能管理工具组：\n   - load_skill\n\
  \n7. 内部管理工具组：\n   - write_todos\n   - read_memorandum\n   - write_memorandum\n\n\
  分组依据：功能相似性、使用场景关联性。每个组将分配给子代理进行测试。"
工具组测试计划: "为每个工具组定义的测试范围和预期输出：\n\n1. 工作区文件操作组：\n   - 测试范围：\n     * download_file_by_id：下载一个示例文件（需要文件ID）\n\
  \     * read_workspace_file：读取现有文件的内容\n     * list_workspace_files：列出工作区目录\n   \
  \  * modify_workspace_file：修改文件内容\n     * create_workspace_file：创建新文件\n   - 预期输出：每个工具成功执行，文件操作结果符合预期。\n\
  \n2. 网络/搜索工具组：\n   - 测试范围：\n     * search_links_by_keywords：使用关键词“test”进行搜索\n  \
  \   * fetch_content_by_urls：获取一个已知URL的内容（例如，示例网站）\n   - 预期输出：返回搜索结果和网页内容。\n\n3.\
  \ 任务委托工具组：\n   - 测试范围：\n     * assign_task：分配一个简单任务（例如，打印“Hello”）\n     * query_task_by_id：查询任务状态\n\
  \     * stop_task_by_id：停止一个任务（如果可能）\n   - 预期输出：任务分配成功，查询返回状态，停止请求被接受。\n\n4. 图像处理工具组：\n\
  \   - 测试范围：\n     * agent_ocr_analysis：对包含文本的示例图像进行OCR分析\n     * send_images_to_user：发送示例图像\n\
  \   - 预期输出：OCR返回文本，图像发送成功。\n\n5. 代码执行工具组：\n   - 测试范围：\n     * run_workspace_command：运行简单命令（如`ls\
  \ -la`）\n     * execute_python_code：执行打印“Hello”的Python代码\n   - 预期输出：命令输出和代码执行结果。\n\
  \n6. 技能管理工具组：\n   - 测试范围：\n     * load_skill：加载“algorithmic-art”技能（如果可用）\n   - 预期输出：技能指南内容。\n\
  \n7. 内部管理工具组：\n   - 测试范围：\n     * write_todos：创建待办事项列表\n     * read_memorandum：读取备忘录\n\
  \     * write_memorandum：写入备忘录\n   - 预期输出：待办事项列表更新，备忘录内容正确。\n\n每个子代理应验证工具是否按预期工作，报告任何错误或问题，并提供测试结果摘要。"
