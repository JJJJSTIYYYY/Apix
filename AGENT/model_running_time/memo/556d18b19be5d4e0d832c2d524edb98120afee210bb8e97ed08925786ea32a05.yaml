PPT Redesign - Rounded Style: '用户反馈：当前PPT设计“丑爆了”，用户更喜欢圆润的设计风格，但不喜欢圆形或椭圆形。当前版本使用了大量直角方形和一些椭圆，需要修改。


  设计决策：

  1. 所有矩形形状替换为圆角矩形（ROUNDED_RECTANGLE），圆角半径设为0.2英寸。

  2. 完全避免使用椭圆形（OVAL）。

  3. 布局采用更流动、不对称的设计，避免僵硬的网格。

  4. 使用柔和的阴影和透明度来增加深度感。

  5. 颜色主题保持不变（基于背景图片平均颜色）。

  6. 每张幻灯片保持视觉元素，但使用圆角形状和更有机的排列。

  7. 标题区域使用圆角标签，内容卡片使用圆角矩形。

  8. 活动列表使用圆角矩形作为图标背景，而非椭圆形。

  9. 联系按钮使用大圆角半径的圆角矩形。

  10. 整体减少直角，增加圆润感，但避免圆形和椭圆。'
